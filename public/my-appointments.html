<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fbf9f6">
    <title>Meus agendamentos | Fabi Nails</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="/my-appointments.js" defer></script>
  </head>
  <body class="my-appointments-page">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Fabi Nails, agendamento">
        <span class="brand-mark" aria-hidden="true">F</span>
        <span class="brand-name">Fabi Nails</span>
      </a>
      <a class="admin-link" href="/">Novo agendamento</a>
    </header>
    <main class="my-appointments-layout">
      <section aria-labelledby="my-appointments-title">
        <p class="eyebrow">ÁREA DA CLIENTE</p>
        <h1 id="my-appointments-title">Meus agendamentos</h1>
        <p class="intro-copy">Consulte seus horários e cancele uma reserva se precisar. O motivo do cancelamento é opcional.</p>
        <p id="client-appointments-message" class="admin-message" role="status" aria-live="polite">Carregando agendamentos...</p>
        <div id="client-appointments-list" class="client-appointments-list"></div>
      </section>
    </main>
    <footer class="page-footer"><span>FABI NAILS</span><span>Beleza nos detalhes.</span></footer>
  </body>
</html>
